name: Querity Eval & Guardrail CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  deterministic-eval-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r querity_team/requirements.txt

      - name: Run pytest suite
        run: |
          python -m pytest backend/test_multitable_joins.py backend/test_llm_providers.py backend/test_live_generation.py backend/test_sql_guard_hardening.py querity_team/tests/test_deterministic_nodes.py -v

      - name: Run deterministic Runner and DetGate
        run: |
          python -c "import json, sys; from querity_team.deterministic_nodes import run_benchmark_and_guardrails, evaluate_deterministic_gate; out = run_benchmark_and_guardrails(); route, verdict, _ = evaluate_deterministic_gate(out); print(json.dumps(out['eval_report'], indent=2)); sys.exit(0 if verdict.status == 'PASS' else 1)"
